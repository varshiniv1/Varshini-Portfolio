<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono',monospace">
  <rect width="900" height="300" fill="#171c1a"/>

  <!-- Storage -->
  <text x="107" y="30" fill="#8d9895" font-size="11" text-anchor="middle" letter-spacing="1">STORAGE</text>
  <g transform="translate(35,44)">
    <ellipse cx="72" cy="0" rx="72" ry="14" fill="#1d2321" stroke="#da7756" stroke-width="1.5"/>
    <rect x="0" y="0" width="144" height="118" fill="#1d2321" stroke="#da7756" stroke-width="1.5"/>
    <ellipse cx="72" cy="118" rx="72" ry="14" fill="#1d2321" stroke="#da7756" stroke-width="1.5"/>
    <line x1="14" y1="38" x2="130" y2="38" stroke="#232b28" stroke-width="4"/>
    <line x1="14" y1="68" x2="130" y2="68" stroke="#232b28" stroke-width="4"/>
    <line x1="14" y1="98" x2="130" y2="98" stroke="#232b28" stroke-width="4"/>
    <text x="72" y="146" fill="#eef2f0" font-size="10.5" text-anchor="middle" font-weight="600">Page/Row</text>
    <text x="72" y="160" fill="#8d9895" font-size="9.5" text-anchor="middle">RandomAccessFile</text>
  </g>
  <path d="M186,110 C215,110 230,110 258,110" stroke="#da7756" stroke-width="2" fill="none"/>
  <polygon points="253,105 262,110 253,115" fill="#da7756"/>

  <!-- Buffer Manager -->
  <text x="335" y="30" fill="#8d9895" font-size="11" text-anchor="middle" letter-spacing="1">BUFFER MANAGER</text>
  <rect x="263" y="70" width="144" height="80" rx="8" fill="#1d2321" stroke="#232b28" stroke-width="1.5"/>
  <rect x="279" y="86" width="112" height="14" rx="3" fill="#232b28"/>
  <rect x="279" y="106" width="112" height="14" rx="3" fill="#232b28"/>
  <rect x="279" y="126" width="70" height="14" rx="3" fill="#da7756" opacity=".85"/>
  <text x="335" y="163" fill="#da7756" font-size="10" text-anchor="middle" font-weight="700">LRU Eviction</text>
  <path d="M414,110 C443,110 458,110 486,110" stroke="#da7756" stroke-width="2" fill="none"/>
  <polygon points="481,105 490,110 481,115" fill="#da7756"/>

  <!-- B+-Tree Index -->
  <text x="565" y="30" fill="#8d9895" font-size="11" text-anchor="middle" letter-spacing="1">B+ TREE INDEX</text>
  <rect x="533" y="46" width="64" height="28" rx="5" fill="#1d2321" stroke="#da7756" stroke-width="1.5"/>
  <text x="565" y="64" fill="#eef2f0" font-size="10" text-anchor="middle" font-weight="600">Root</text>
  <line x1="565" y1="74" x2="510" y2="98" stroke="#232b28" stroke-width="1.5"/>
  <line x1="565" y1="74" x2="620" y2="98" stroke="#232b28" stroke-width="1.5"/>
  <rect x="478" y="100" width="64" height="26" rx="5" fill="#1d2321" stroke="#232b28" stroke-width="1.5"/>
  <text x="510" y="117" fill="#8d9895" font-size="9.5" text-anchor="middle">Node</text>
  <rect x="588" y="100" width="64" height="26" rx="5" fill="#1d2321" stroke="#232b28" stroke-width="1.5"/>
  <text x="620" y="117" fill="#8d9895" font-size="9.5" text-anchor="middle">Node</text>
  <line x1="510" y1="126" x2="490" y2="150" stroke="#232b28" stroke-width="1"/>
  <line x1="510" y1="126" x2="530" y2="150" stroke="#232b28" stroke-width="1"/>
  <line x1="620" y1="126" x2="600" y2="150" stroke="#232b28" stroke-width="1"/>
  <line x1="620" y1="126" x2="640" y2="150" stroke="#232b28" stroke-width="1"/>
  <rect x="468" y="152" width="46" height="20" rx="4" fill="#1d2321" stroke="#da7756" stroke-width="1"/>
  <rect x="518" y="152" width="46" height="20" rx="4" fill="#1d2321" stroke="#da7756" stroke-width="1"/>
  <rect x="578" y="152" width="46" height="20" rx="4" fill="#1d2321" stroke="#da7756" stroke-width="1"/>
  <rect x="628" y="152" width="46" height="20" rx="4" fill="#1d2321" stroke="#da7756" stroke-width="1"/>
  <text x="565" y="188" fill="#da7756" font-size="9.5" text-anchor="middle" font-weight="600">Point &amp; range search</text>
  <path d="M655,110 C670,110 680,110 695,110" stroke="#da7756" stroke-width="2" fill="none"/>
  <polygon points="690,105 699,110 690,115" fill="#da7756"/>

  <!-- Query Executor -->
  <text x="792" y="30" fill="#8d9895" font-size="11" text-anchor="middle" letter-spacing="1">QUERY EXECUTOR</text>
  <rect x="705" y="60" width="174" height="50" rx="7" fill="#1d2321" stroke="#232b28" stroke-width="1.5"/>
  <text x="792" y="90" fill="#eef2f0" font-size="10.5" text-anchor="middle" font-weight="600">Block Nested Loop Join</text>
  <rect x="705" y="122" width="174" height="50" rx="7" fill="#1d2321" stroke="#232b28" stroke-width="1.5"/>
  <text x="792" y="152" fill="#eef2f0" font-size="10.5" text-anchor="middle" font-weight="600">Range Scan · CLI</text>

  <!-- Callout -->
  <rect x="263" y="222" width="470" height="46" rx="8" fill="#1d2321" stroke="#da7756" stroke-width="1.5"/>
  <text x="498" y="243" fill="#da7756" font-size="14" text-anchor="middle" font-weight="700">300–3000× faster than full table scans</text>
  <text x="498" y="259" fill="#8d9895" font-size="9.5" text-anchor="middle">Validated against PostgreSQL on the IMDB dataset</text>
</svg>
